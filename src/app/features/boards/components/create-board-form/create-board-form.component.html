
@if (showTrigger()) {
  <app-icon-button
    icon="plus"
    [label]="'stages.add' | transloco"
    variant="primary"
    size="lg"
    (clicked)="open()"
  />
}

@if (isOpen()) {
  <ui-dialog-shell
    [title]="'stages.create' | transloco"
    titleId="create-board-title"
    [showFooter]="true"
    (closed)="close()"
  >
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="create-board-form">
    <ui-form-field [label]="'stages.name' | transloco" [error]="nameError()">
      <ui-text-input
        formControlName="name"
        [placeholder]="'stages.namePlaceholder' | transloco"
        [maxLength]="nameMaxLength"
      />
    </ui-form-field>

    <div class="create-board-form__field">
      <label class="app-form-label">{{ 'stages.card.track' | transloco }}</label>
      <ui-select
        [options]="trackOptions()"
        [nullOption]="'stages.noTrackSelected' | transloco"
        formControlName="selectedTrackId"
      />
    </div>
  </form>

  <ng-container dialog-footer>
    <normal-button type="button" variant="secondary" (clicked)="close()">
      {{ 'common.cancel' | transloco }}
    </normal-button>

    <normal-button
      type="submit"
      [disabled]="submitting()"
      [loading]="submitting()"
      (clicked)="onSubmit()"
    >
      {{ 'stages.create' | transloco }}
    </normal-button>
  </ng-container>
  </ui-dialog-shell>
}
