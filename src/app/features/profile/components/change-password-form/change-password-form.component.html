
<form class="app-form-stack" [formGroup]="form" (ngSubmit)="onSubmit()">
  <input
    class="visually-hidden"
    type="text"
    name="username"
    autocomplete="username"
    [attr.aria-label]="'profile.username' | transloco"
    [value]="username()"
    readonly
    tabindex="-1"
  />

  <ui-form-field
    [label]="'profile.passwordForm.current' | transloco"
    [error]="currentError()"
  >
    <ui-text-input formControlName="current" type="password" autocomplete="current-password" [maxLength]="passwordMaxLength" />
  </ui-form-field>

  <ui-form-field
    [label]="'profile.passwordForm.new' | transloco"
    [error]="newError()"
  >
    <ui-text-input formControlName="next" type="password" autocomplete="new-password" [maxLength]="passwordMaxLength" />
  </ui-form-field>

  <ui-form-actions>
    <normal-button
      type="submit"
      [disabled]="form.invalid || isSubmitting()"
      [loading]="isSubmitting()"
    >
      {{
        (isSubmitting() ? 'profile.passwordForm.saving' : 'profile.passwordForm.submit') | transloco
      }}
    </normal-button>
  </ui-form-actions>
</form>
