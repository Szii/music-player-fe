
<form class="app-form-stack" [formGroup]="form" (ngSubmit)="onSubmit()">
  <ui-form-field
    [label]="'profile.usernameForm.label' | transloco"
    [error]="nameError()"
  >
    <ui-text-input formControlName="name" autocomplete="username" [maxLength]="nameMaxLength" />
  </ui-form-field>

  <ui-form-actions>
    <normal-button
      type="submit"
      [disabled]="form.invalid || isSubmitting()"
      [loading]="isSubmitting()"
    >
      {{
        (isSubmitting() ? 'profile.usernameForm.saving' : 'profile.usernameForm.submit') | transloco
      }}
    </normal-button>
  </ui-form-actions>
</form>
