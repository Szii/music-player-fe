
<p class="change-email__hint">{{ 'profile.emailForm.hint' | transloco }}</p>

@if (!showEmailInputs) {
  <p class="change-email__disabled-note">{{ 'profile.emailForm.unavailable' | transloco }}</p>
}

<form
  class="app-form-stack"
  [class.change-email__form--disabled]="!showEmailInputs"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
>
  <input
    class="visually-hidden"
    type="text"
    name="username"
    autocomplete="username"
    [attr.aria-label]="'profile.username' | transloco"
    [value]="username()"
    readonly
    tabindex="-1"
  />

  <ui-form-field
    [label]="'profile.emailForm.newEmail' | transloco"
    [error]="emailError()"
  >
    <ui-text-input formControlName="email" type="email" autocomplete="email" [maxLength]="limits.email" />
  </ui-form-field>

  <ui-form-field
    [label]="'profile.emailForm.currentPassword' | transloco"
    [error]="passwordError()"
  >
    <ui-text-input formControlName="password" type="password" autocomplete="current-password" [maxLength]="limits.password" />
  </ui-form-field>

  <ui-form-actions>
    <normal-button
      type="submit"
      [disabled]="form.invalid || isSubmitting() || !showEmailInputs"
      [loading]="isSubmitting()"
    >
      {{ (isSubmitting() ? 'profile.emailForm.sending' : 'profile.emailForm.submit') | transloco }}
    </normal-button>
  </ui-form-actions>
</form>
