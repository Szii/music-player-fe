
<div class="group-card">
  <div class="group-card__header">
    <span class="group-card__title" [title]="displayName()">
      {{ displayName() }}
    </span>

    <div class="group-card__header-actions">
      <ui-chip
        class="group-card__count"
        [variant]="trackCount() > 0 ? 'success' : 'gold'"
        size="sm"
        shape="hex"
        [dot]="true"
      >
        {{ trackCountLabel() }}
      </ui-chip>

      <ui-action-menu
        [items]="menuItems()"
        [disabled]="updating()"
        [triggerLabel]="'groups.actionsFor' | transloco: { name: displayName() }"
        (select)="onMenuSelect($event)"
      />
    </div>
  </div>
</div>

@if (renameOpen()) {
  <ui-dialog-shell
    [title]="'groups.rename' | transloco"
    [showFooter]="true"
    (closed)="closeRename()"
  >
    <div class="rename-form">
      <label class="app-form-label">{{ 'groups.name' | transloco }}</label>
      <input
        class="app-input"
        type="text"
        [ngModel]="editingName()"
        (ngModelChange)="editingName.set($event)"
        [ngModelOptions]="{ standalone: true }"
        [placeholder]="'groups.namePlaceholder' | transloco"
        [maxlength]="nameMaxLength"
        (keydown.enter)="confirmRename()"
        (keydown.escape)="closeRename()"
      />
      <ui-char-counter [current]="editingName().length" [max]="nameMaxLength" />
      @if (renameError()) {
        <p class="rename-form__error">{{ renameError() }}</p>
      }
    </div>

    <normal-button dialog-footer type="button" variant="secondary" (clicked)="closeRename()">
      {{ 'common.cancel' | transloco }}
    </normal-button>

    <normal-button
      dialog-footer
      type="button"
      [disabled]="!editingName().trim() || !!renameError()"
      (clicked)="confirmRename()"
    >
      {{ 'common.save' | transloco }}
    </normal-button>
  </ui-dialog-shell>
}
