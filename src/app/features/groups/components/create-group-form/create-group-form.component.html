
@if (showTrigger()) {
  <app-icon-button
    icon="plus"
    [label]="'groups.add' | transloco"
    variant="primary"
    size="lg"
    (clicked)="open()"
  />
}

@if (isOpen()) {
  <ui-dialog-shell
    [title]="'groups.create' | transloco"
    titleId="create-group-title"
    [showFooter]="true"
    (closed)="close()"
  >
    <form [formGroup]="createForm" (ngSubmit)="submit()" class="create-group-form">
      <ui-form-field [label]="'groups.name' | transloco" [error]="nameError()">
        <ui-text-input
          formControlName="listName"
          [placeholder]="'groups.namePlaceholder' | transloco"
          [autofocus]="true"
          [maxLength]="nameMaxLength"
        />
      </ui-form-field>
    </form>

    <ng-container dialog-footer>
      <normal-button type="button" variant="ghost" (clicked)="close()">
        {{ 'common.cancel' | transloco }}
      </normal-button>
      <normal-button
        type="submit"
        [disabled]="submitting() || !createForm.value.listName?.trim()"
        [loading]="submitting()"
        (clicked)="submit()"
      >
        {{ 'groups.create' | transloco }}
      </normal-button>
    </ng-container>
  </ui-dialog-shell>
}
