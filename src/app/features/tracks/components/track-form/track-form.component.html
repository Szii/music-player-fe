
@if (showTrigger()) {
  <app-icon-button
    icon="plus"
    [label]="'tracks.add' | transloco"
    variant="primary"
    size="lg"
    (clicked)="open()"
  />
}

@if (isOpen()) {
  <ui-dialog-shell
    [title]="(isEditing() ? 'tracks.edit' : 'tracks.add') | transloco"
    titleId="track-modal-title"
    [showFooter]="true"
    (closed)="close()"
  >
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="track-form">
      <ui-form-field [label]="'tracks.name' | transloco" [error]="trackNameError()">
        <ui-text-input
          formControlName="trackName"
          [placeholder]="'tracks.namePlaceholder' | transloco"
          [maxLength]="limits.name"
        />
      </ui-form-field>

      <ui-form-field [label]="'tracks.link' | transloco" [error]="trackLinkError()">
        <ui-text-input
          formControlName="trackLink"
          type="url"
          placeholder="https://youtube.com/..."
          [maxLength]="trackLinkMaxLength()"
        />
        @if (linkLocked()) {
          <span class="track-form__hint">{{ 'tracks.linkLocked' | transloco }}</span>
        }
      </ui-form-field>
    </form>

    <ng-container dialog-footer>
      <normal-button
        type="button"
        variant="secondary"
        (clicked)="close()"
      >
        {{ 'common.cancel' | transloco }}
      </normal-button>

      <normal-button
        type="submit"
        [disabled]="form.invalid || submitting()"
        [loading]="submitting()"
        (clicked)="onSubmit()"
      >
        {{ (isEditing() ? 'common.saveChanges' : 'tracks.add') | transloco }}
      </normal-button>
    </ng-container>
  </ui-dialog-shell>
}
