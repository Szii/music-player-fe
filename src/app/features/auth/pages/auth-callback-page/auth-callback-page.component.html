
<div class="app-page app-page--narrow">
  <ui-card [title]="'auth.signingInTitle' | transloco">
    @switch (state()) {
      @case ('signing-in') {
        <p class="callback-page__text" role="status">{{ 'auth.completingSignIn' | transloco }}</p>
      }
      @case ('failed') {
        <p class="callback-page__text callback-page__text--error" role="alert">
          {{ 'auth.err.googleFailed' | transloco }}
        </p>
        <div class="callback-page__link">
          <a routerLink="/login">{{ 'auth.backToLogin' | transloco }}</a>
        </div>
      }
    }
  </ui-card>
</div>
