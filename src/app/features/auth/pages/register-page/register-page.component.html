
<div class="app-page app-page--narrow">
  <app-auth-toolbar />

  <ui-card [title]="'auth.register' | transloco">
    @if (registered()) {
      <app-verification-required
        (cancel)="onGoToLogin()"
        (registerAgain)="onRegisterAgain()"
      />
    } @else {
      @if (formError()) {
        <ui-alert variant="danger" role="alert">{{ formError() }}</ui-alert>
      }

      <form class="app-form-stack" [formGroup]="form" (ngSubmit)="onSubmit()">
        <ui-form-field
          [label]="'profile.username' | transloco"
          [error]="nameError()"
        >
          <ui-text-input formControlName="name" name="username" autocomplete="username" [maxLength]="limits.name" />
        </ui-form-field>

        <ui-form-field
          [label]="'profile.email' | transloco"
          [error]="emailError()"
        >
          <ui-text-input formControlName="email" type="email" autocomplete="email" [maxLength]="limits.email" />
        </ui-form-field>

        <ui-form-field
          [label]="'auth.password' | transloco"
          [error]="passwordError()"
        >
          <ui-text-input formControlName="password" type="password" autocomplete="new-password" [maxLength]="limits.password" />
        </ui-form-field>

        <ui-form-field
          [label]="'auth.confirmPassword' | transloco"
          [error]="confirmError()"
        >
          <ui-text-input formControlName="confirm" type="password" autocomplete="new-password" [maxLength]="limits.password" />
        </ui-form-field>

        <div class="register-page__agree">
          <input
            id="register-agree"
            class="register-page__agree-input"
            type="checkbox"
            formControlName="agree"
          />
          <div class="register-page__agree-text">
            <label for="register-agree">{{ 'auth.agreeTo' | transloco }}</label>
            <a class="register-page__terms-link" routerLink="/legal" target="_blank">
              {{ 'legal.title' | transloco }}
            </a>
          </div>
        </div>

        <normal-button
          type="submit"
          size="lg"
          [fullWidth]="true"
          [disabled]="form.invalid || isSubmitting()"
          [loading]="isSubmitting()"
        >
          {{ (isSubmitting() ? 'auth.creatingAccount' : 'auth.createAccount') | transloco }}
        </normal-button>
      </form>

      <div class="register-page__divider">
        <span class="register-page__divider-label">{{ 'auth.or' | transloco }}</span>
      </div>

      <app-google-sign-in-button [label]="'auth.googleSignUp' | transloco" />

      <div class="register-page__links">
        <a routerLink="/login">{{ 'auth.haveAccount' | transloco }}</a>
      </div>
    }
  </ui-card>

  <app-footer />
</div>
