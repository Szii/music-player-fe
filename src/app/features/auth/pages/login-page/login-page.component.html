
<div class="app-page app-page--narrow">
  <ui-card title="Login">
    @if (needsVerification()) {
      <app-verification-required
        mode="unverified"
        (cancel)="onBackToLogin()"
        (registerAgain)="onRegisterAgain()"
      />
    } @else {
      @if (formError()) {
        <ui-alert variant="danger" role="alert">{{ formError() }}</ui-alert>
      }

      <form class="app-form-stack" [formGroup]="form" (ngSubmit)="onSubmit()">
        <ui-form-field
          label="Email"
          [error]="emailError()"
        >
          <ui-text-input formControlName="email" type="email" autocomplete="email" />
        </ui-form-field>

        <ui-form-field
          label="Password"
          [error]="passwordError()"
        >
          <ui-text-input formControlName="password" type="password" autocomplete="current-password" />
        </ui-form-field>

        <normal-button
          type="submit"
          size="lg"
          [fullWidth]="true"
          [disabled]="form.invalid || isSubmitting()"
          [loading]="isSubmitting()"
        >
          {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
        </normal-button>
      </form>

      <div class="login-page__divider">
        <span class="login-page__divider-label">or</span>
      </div>

      <app-google-sign-in-button label="Sign in with Google" />

      <nav class="login-page__links">
        @if (showEmailInputs) {
          <a routerLink="/forgot-password">Forgot password?</a>
        } @else {
          <span class="auth-page__link--disabled" aria-disabled="true">Forgot password?</span>
        }
        <a routerLink="/register">Need an account? Register</a>
      </nav>
    }
  </ui-card>

  <app-footer />
</div>
