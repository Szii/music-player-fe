
<div class="app-page app-page--narrow">
  <ui-card [title]="'auth.forgotTitle' | transloco">
    @if (sent()) {
      <p class="forgot-page__text">{{ 'auth.forgotSent' | transloco }}</p>
      <div class="forgot-page__link">
        <a routerLink="/login">{{ 'auth.backToLogin' | transloco }}</a>
      </div>
    } @else {
      <p class="forgot-page__text">{{ 'auth.forgotIntro' | transloco }}</p>

      <form class="app-form-stack" [formGroup]="form" (ngSubmit)="onSubmit()">
        <ui-form-field
          [label]="'profile.email' | transloco"
          [error]="emailError()"
        >
          <ui-text-input formControlName="email" type="email" autocomplete="email" />
        </ui-form-field>

        <ui-form-actions>
          <normal-button
            type="submit"
            [disabled]="form.invalid || isSubmitting()"
            [loading]="isSubmitting()"
          >
            {{ (isSubmitting() ? 'auth.verify.sending' : 'auth.sendResetLink') | transloco }}
          </normal-button>
        </ui-form-actions>
      </form>

      <div class="forgot-page__link">
        <a routerLink="/login">{{ 'auth.backToLogin' | transloco }}</a>
      </div>
    }
  </ui-card>
</div>
