
<div class="ui-search-box">
  <input
    #field
    class="app-input ui-search-box__input"
    type="text"
    autocomplete="off"
    [attr.aria-label]="ariaLabel() || null"
    [placeholder]="placeholder() || ('common.search' | transloco)"
    [value]="value()"
    (input)="valueChange.emit($any($event.target).value)"
  />

  @if (value()) {
    <button
      type="button"
      class="ui-search-box__clear"
      (click)="clear()"
      [attr.aria-label]="'common.clearSearch' | transloco"
      [title]="'common.clear' | transloco"
    >
      ✕
    </button>
  }
</div>
