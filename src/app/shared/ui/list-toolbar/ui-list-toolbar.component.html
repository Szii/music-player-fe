
<div class="ui-list-toolbar">
  <ui-search-box
    class="ui-list-toolbar__search"
    [value]="search()"
    [placeholder]="searchPlaceholder()"
    (valueChange)="search.set($event)"
  />

  @if (filterOptions(); as opts) {
    <label class="ui-list-toolbar__field">
      <span class="ui-list-toolbar__label">
        {{ filterLabel() || ('common.filter' | transloco) }}
      </span>
      <ui-select
        [options]="opts"
        [ngModel]="filterValue()"
        [enableSearch]="false"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="filterValueChange.emit($event)"
      />
    </label>
  }

  @if (sortOptions(); as opts) {
    <label class="ui-list-toolbar__field">
      <span class="ui-list-toolbar__label">
        {{ sortLabel() || ('common.sort' | transloco) }}
      </span>
      <ui-select
        [options]="opts"
        [ngModel]="sortValue()"
        [enableSearch]="false"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="sortValueChange.emit($event)"
      />
    </label>
  }
</div>

@if (showCount()) {
  <!-- ponytail: count-only phrasing dodges plural rules (cs has 3 forms).
       Add @jsverse/transloco-messageformat if the item noun must come back. -->
  <div class="ui-list-toolbar__count">
    {{ 'common.showingCount' | transloco: { filtered: filteredCount(), total: totalCount() } }}
  </div>
}
