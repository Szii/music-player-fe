
<footer class="page-footer">
  <div class="page-footer__inner">
    <div class="page-footer__rule" aria-hidden="true"></div>

    <div class="page-footer__bar">
      <p class="page-footer__copy">
        © {{ year }} {{ 'app.brand' | transloco }}
        <span class="page-footer__sep" aria-hidden="true">·</span>
        <span class="page-footer__version">v{{ version }}</span>
      </p>

      <p class="page-footer__contact">
        <a class="page-footer__link" routerLink="/legal">{{ 'legal.title' | transloco }}</a>
        <span class="page-footer__sep" aria-hidden="true">·</span>
        <span class="page-footer__contact-email">
          {{ 'footer.contact' | transloco }}
          <a [href]="'mailto:' + contactEmail">{{ contactEmail }}</a>
        </span>
      </p>
    </div>
  </div>
</footer>
