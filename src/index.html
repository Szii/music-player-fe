<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sound Masters Lair</title>
  <base href="/">
  <!-- resizes-content: the on-screen keyboard shrinks the layout viewport, so a
       full-screen fixed overlay (dialog, select sheet) shrinks with it and its
       focused search input scrolls into view instead of hiding under the keyboard. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- As a <link> rather than an @import in styles.css: the build inlines this
       stylesheet into the page (optimization.fonts), which it cannot do for an
       @import, and the font CSS no longer waits on styles.css to parse first. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
