<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sound Masters Lair</title>
  <base href="/">
  <!-- resizes-content: the on-screen keyboard shrinks the layout viewport, so a
       full-screen fixed overlay (dialog, select sheet) shrinks with it and its
       focused search input scrolls into view instead of hiding under the keyboard. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Starts the translation fetch in parallel with the bundle; see the file
       for why it is a separate script and not inline. -->
  <script src="i18n-preload.js"></script>
  <!-- As a <link> rather than an @import in styles.css: the build inlines this
       stylesheet into the page (optimization.fonts), which it cannot do for an
       @import, and the font CSS no longer waits on styles.css to parse first. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Cinzel only. 'Cinzel Decorative' was requested here but no rule ever used
       it, so it cost four woff2 downloads for nothing. Both latin and latin-ext
       subsets are kept — Czech needs latin-ext. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
